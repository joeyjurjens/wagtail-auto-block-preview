name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check wagtail_auto_block_preview/

  test:
    runs-on: ubuntu-latest
    strategy:
      # Wagtail versions under active support per
      # https://github.com/wagtail/wagtail/wiki/Release-schedule, plus the
      # next release's rc so breakage surfaces before it's actually out.
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        wagtail-version: ["7.0", "7.3", "7.4", "8.0rc1"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv add --prerelease=allow django==5.2 wagtail==${{ matrix.wagtail-version }}
      - run: uv run pytest tests/
